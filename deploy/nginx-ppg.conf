# 云机 Nginx 站点 —— /etc/nginx/sites-available/ppg
# HTTP 先跑通；:443/TLS 块预留，待域名就绪用 certbot 补。
# 所有流量(静态+API)经 frp 隧道回源到本机 Caddy(127.0.0.1:8088)。

limit_req_zone $binary_remote_addr zone=ppg_ip:10m rate=10r/s;

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	# 泄压阀：公网机是唯一入口，限流保护穿透到本机的后端
	limit_req zone=ppg_ip burst=20 nodelay;

	location / {
		proxy_pass http://127.0.0.1:8088;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 120s;
		proxy_connect_timeout 10s;
	}
}

